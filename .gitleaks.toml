# gitleaks's own rules, minus what in this repo only looks like a secret.
# Check the tree with: gitleaks dir . --redact
[extend]
useDefault = true

[[allowlists]]
description = "Public values: EVM addresses, Anthropic message ids in recorded brain streams"
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
  '''^msg_[0-9A-Za-z]+$''',
]

[[allowlists]]
description = "Published test vectors: web3's documented account, RFC 8032's first Ed25519 key, a made-up HMAC secret"
regexes = [
  '''^0x4c0883a69102937d6231471b5dbb6204fe5129617082792ae468d01a3f362318$''',
  '''^49W385L4rePHy6PAaQUovbD2aacgN4HsKXSMeUzRg4fmwXszN91JuMFrQRj3vMDpZuRF3ZknQBuRBoWQJEfXstMw$''',
  '''^cmV2aWV3ZWQtYnVpbGRlci1zZWNyZXQ=$''',
]
