name: Report a bug
description: Something in Auni, or in one of its apps, that did the wrong thing.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Auni's own card fills most of this in for you, from its records. Everything here is public: never paste a key, a seed phrase or a wallet address. For anything that could lose someone money, write to the address in SECURITY.md instead.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you expected, and what Auni did instead.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App
      description: The app it happened in, if it was one.
  - type: input
    id: tool
    attributes:
      label: What Auni tried
      description: The move that failed, by the name of Auni's tool.
  - type: input
    id: failure
    attributes:
      label: Why it stopped
      description: The kind of failure Auni recorded.
  - type: textarea
    id: said
    attributes:
      label: What Auni said
      description: The sentence on the card, when the app knew this refusal.
  - type: input
    id: tries
    attributes:
      label: Tries
  - type: input
    id: version
    attributes:
      label: Auni's version
      description: From `auni --version`, with the commit when you run a clone.
  - type: textarea
    id: error
    attributes:
      label: The error as it came
      description: Auni cuts links to their site and blanks addresses and amounts. Read it before you post it.
  - type: textarea
    id: transaction
    attributes:
      label: The transaction link
      description: This shows your wallet address beside your GitHub name.
  - type: textarea
    id: details
    attributes:
      label: The same, as data
      description: Auni fills this in so a coding agent need not read the prose. Leave it as it is.
      render: json
